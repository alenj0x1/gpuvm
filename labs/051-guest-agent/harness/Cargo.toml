[package]
name = "harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpuvm-agent = { path = "../../../guest/agent" }
serde_json = "1"
png = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[profile.release]
opt-level = 3
debug = false
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
