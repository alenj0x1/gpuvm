<!doctype html>
<html><body style="margin:0;overflow:hidden;background:#000">
<!-- Lab 063: GPU drawing on the PC, like an animated app next to the viewer: a full-window fragment shader redrawn on
     every frame. Opened by host-load.ps1 in a headless Edge; ?iters= sets its cost. -->
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), gl = c.getContext('webgl2');
const iters = +(new URLSearchParams(location.search).get('iters') || 60);
c.width = innerWidth; c.height = innerHeight;
const vs = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }`;
const fs = `#version 300 es
precision highp float; uniform float t; uniform vec2 r; out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / r; vec3 col = vec3(0.);
  for (int i = 0; i < ${iters}; i++) { float f = float(i);
    col += 0.5 + 0.5 * cos(t * 0.7 + uv.xyx * (3. + f * 0.05) + vec3(0., 2., 4.) + f); }
  o = vec4(col / float(${iters}), 1.); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't'), ur = gl.getUniformLocation(pr, 'r');
function frame(t) { gl.viewport(0, 0, c.width, c.height); gl.uniform1f(ut, t / 1000); gl.uniform2f(ur, c.width, c.height); gl.drawArrays(gl.TRIANGLES, 0, 3); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script></body></html>
