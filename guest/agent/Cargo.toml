[package]
name = "gpuvm-agent"
version = "0.4.9"
edition = "2021"
publish = false
description = "GpuVM guest agent: a SYSTEM service that dials the host over Hyper-V sockets and a session helper that captures the screen, drives input and UI Automation for AI agents (docs/agents/protocol.md)"

[lib]
name = "gpuvm_agent"
path = "src/lib.rs"

[[bin]]
name = "gpuvm-agent"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
png = "0.18"
image-webp = "0.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_Display",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
